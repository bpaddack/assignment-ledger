name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: Copy-Item config/tracker.package.json config/tracker.json
        shell: pwsh
      - run: npm ci
      - run: npm run lint
      - run: npm test
